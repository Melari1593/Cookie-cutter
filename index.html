<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Lee y escribe etiquetas NFC desde el navegador.">
  <title>Lector NFC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Lector NFC</h1>
    <p class="subtitle">Acerca una etiqueta a la parte trasera del teléfono</p>
  </header>

  <main>
    <div id="support-banner" class="banner" hidden></div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-read" aria-controls="panel-read" aria-selected="true">Leer</button>
      <button class="tab" role="tab" id="tab-write" aria-controls="panel-write" aria-selected="false">Escribir</button>
    </nav>

    <section id="panel-read" role="tabpanel" aria-labelledby="tab-read">
      <div class="scanner" id="scanner" data-state="idle">
        <div class="pulse" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M6 8.3a6 6 0 0 1 0 7.4M9.5 6a10 10 0 0 1 0 12M13 4a14 14 0 0 1 0 16"/>
          </svg>
        </div>
        <p id="scan-status" class="status" aria-live="polite">Pulsa «Iniciar lectura» para empezar.</p>
        <button id="scan-btn" class="btn primary">Iniciar lectura</button>
      </div>

      <div class="history-head">
        <h2>Historial <span id="history-count" class="count">0</span></h2>
        <div class="actions">
          <button id="export-btn" class="btn ghost" disabled>Exportar JSON</button>
          <button id="clear-btn" class="btn ghost" disabled>Borrar</button>
        </div>
      </div>
      <p id="empty-history" class="muted">Aún no has leído ninguna etiqueta.</p>
      <ol id="history" class="history"></ol>
    </section>

    <section id="panel-write" role="tabpanel" aria-labelledby="tab-write" hidden>
      <form id="write-form" class="card">
        <label for="write-type">Tipo de registro</label>
        <select id="write-type">
          <option value="text">Texto</option>
          <option value="url">Enlace (URL)</option>
          <option value="json">JSON</option>
        </select>
        <label for="write-value">Contenido</label>
        <textarea id="write-value" rows="4" placeholder="Hola desde mi etiqueta NFC"></textarea>
        <button type="submit" id="write-btn" class="btn primary">Grabar en etiqueta</button>
        <p id="write-status" class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <template id="entry-template">
    <li class="entry card">
      <div class="entry-head">
        <div>
          <div class="serial"></div>
          <time class="muted"></time>
        </div>
        <button class="btn ghost small copy-btn">Copiar</button>
      </div>
      <ul class="records"></ul>
    </li>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
